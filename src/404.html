<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/Poppins-SemiBold.ttf");
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      h3 {
        position: absolute;
        top: 0;
        left: 0;
        padding: 16px;
        height: auto;
        font-size: clamp(2rem, 5vw, 4em);
        display: flex;
        align-items: center;
        margin: 0;

        img {
          height: 1.2em;
          width: auto;
          margin-right: 0.5rem;
        }
      }

      .outer-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: auto;
        width: 90%;
        max-width: 1100px;
        padding: 20px 10px;

        div {
          display: grid;
          grid-template-columns: auto 1fr;
          align-items: center;
          gap: 30px;

          b {
            font-size: clamp(6rem, 12vw, 10rem);
            line-height: 1;
          }

          small {
            font-size: clamp(3.3rem, 3.2vw, 3rem);
            line-height: 1.25;
            margin-bottom: 0;
            margin-left: 0;
            display: inline-block;
          }
        }

        a {
          display: block;
          width: 100%;
          color: #5d8b9e;
          text-decoration-style: wavy;
          text-decoration-thickness: 4.5px;
          font-size: clamp(2.5rem, 5vw, 5rem);
          text-align: right;
          line-height: 1.2;
        }
      }

      .desktop-break {
        display: inline;
      }

      @media (max-width: 768px) {
        .desktop-break {
          display: none;
        }

        .outer-wrapper {
          div {
            grid-template-columns: 1fr;
            text-align: center;
            gap: 10px;

            small {
              font-size: clamp(1.2rem, 5vw, 2rem);
            }
          }

          a {
            text-align: center;
            text-decoration-thickness: 3px;
            margin-top: 20px;
          }
        }
      }

      @media (max-width: 480px) {
        h3 {
          position: relative;
          justify-content: center;
          padding: 20px 0;
        }

        .outer-wrapper {
          position: relative;
          top: 0;
          left: 0;
          transform: none;
          margin: auto 0;
        }
      }
    </style>
  </head>
  <body>
    <h3><img src="assets/logo.svg" alt="FBC Logo" />FBC</h3>
    <div class="outer-wrapper">
      <div>
        <b>404</b>
        <small>Sorry, we couldn't find <br class="desktop-break"/> the page you're looking for.</small>
      </div>
      <a href="https://fbcss.github.io/">take me home.</a>
    </div>
  </body>
</html>
