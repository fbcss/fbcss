name: Update transcripts data (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      sermon_finder:
        type: boolean
        default: false
        description: Enables the sermon finder script instead of the update data one.
        
  schedule:
    - cron: "3 7 * * *"
      timezone: "America/New_York"
    - cron: "56 8 * * *"
      timezone: "America/New_York"
    - cron: "50 10 * * *"
      timezone: "America/New_York"
    - cron: "43 12 * * *"
      timezone: "America/New_York"
    - cron: "36 14 * * *"
      timezone: "America/New_York"
    - cron: "30 16 * * *"
      timezone: "America/New_York"
    - cron: "23 18 * * *"
      timezone: "America/New_York"
    - cron: "16 20 * * *"
      timezone: "America/New_York"
    - cron: "10 22 * * *"
      timezone: "America/New_York"
    - cron: "3 0 * * *"
      timezone: "America/New_York"

concurrency:
  group: transcripts
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, qnap]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Python dependencies
        run: |
          /opt/venv-fbcss/bin/pip install -q -U -r data/requirements.txt

      - name: Save cached cookies to a file
        env:
          COOKIES: ${{ secrets.COOKIES }}
        run: echo "$COOKIES" | base64 -d > cookies.txt

      - name: Run update script
        if: ${{ !inputs.sermon_finder }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          BACKFILL: true
          PYTHONUNBUFFERED: 1
        run: /opt/venv-fbcss/bin/python ./data/update_data.py

      - name: Run finder script
        if: ${{ inputs.sermon_finder }}
        run: /opt/venv-fbcss/bin/python ./data/sermon_finder.py

      - name: Push files to GitHub
        if: ${{ success() || failure() || cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "fbcss-deploy[bot]"
          git config --global user.email "fbcss-deploy[bot]@users.noreply.github.com"
          git add data/transcripts.json data/id_map.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated transcription"
            git fetch origin main --depth=1
            git rebase --onto origin/main HEAD~1 HEAD
            git push origin HEAD:main
          fi

      - name: Clean temp files
        if: always()
        run: rm -f input.* output.json cookies.txt
