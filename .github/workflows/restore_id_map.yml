name: Restore ID map

on:
  workflow_dispatch:

concurrency:
  group: transcripts
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: data/requirements.txt

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r data/requirements.txt

      - name: Run restore script
        env:
          IA_EMAIL: ${{ secrets.IA_EMAIL }}
          PYTHONUNBUFFERED: 1
        run: uv run ./data/restore_id_map.py

      - name: Push files to GitHub
        if: ${{ success() || failure() || cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "fbcss-deploy[bot]"
          git config --global user.email "fbcss-deploy[bot]@users.noreply.github.com"
          git add data/id_map.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated id map restore"
            git fetch origin main --depth=1
            git rebase --onto origin/main HEAD~1 HEAD
            git push origin HEAD:main
          fi
