name: Update transcripts data

on:
  workflow_dispatch:
  schedule:
    - cron: "14 17 * * 0"
    - cron: "33 17 * * 0"
    - cron: "47 17 * * 0"
    - cron: "3 18 * * 0"
    - cron: "5 9 * * 0"
    # Every day at 2:03 AM EST (converted to UTC).
    - cron: "3 7 * * *"
    # Every December 24th at 7:03 & 7:13 PM EST (converted to UTC).
    - cron: "03 0 24 12 *"
    - cron: "13 0 24 12 *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install necessary tools
        run: |
          sudo apt update && sudo apt install build-essential ffmpeg cmake
          pip install yt-dlp requests
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Clone whisper.cpp
        run: git clone https://github.com/ggerganov/whisper.cpp

      - name: Build whisper.cpp
        run: |
          cd whisper.cpp
          make

      - name: Download tiny Whisper model
        run: ./whisper.cpp/models/download-ggml-model.sh tiny.en

      - name: Move tools to the working directory
        run: |
          mv whisper.cpp/build/bin/whisper-cli whisper-cli
          mv whisper.cpp/models/ggml-tiny.en.bin ggml-tiny.en.bin

      - name: Save cached cookies to a file
        env:
          COOKIES: ${{ secrets.COOKIES }}
        run: echo "$COOKIES" | base64 -d > cookies.txt

      - name: Run python script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python3 ./data/update_data.py

      - name: Push files to GitHub
        if: ${{ success() || failure() || cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "fbcss-deploy[bot]"
          git config --global user.email "fbcss-deploy[bot]@users.noreply.github.com"
          git add data/transcripts.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated transcription"
            git pull --rebase origin main
            git push -u origin main
          fi
