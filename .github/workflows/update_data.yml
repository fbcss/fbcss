name: Update transcripts data

on:
  workflow_dispatch:
  schedule:
    - cron: "14 17 * * 0"
    - cron: "33 17 * * 0"
    - cron: "47 17 * * 0"
    - cron: "3 18 * * 0"
    - cron: "5 9 * * 0"
    # Every day at 2:03 AM EST (converted to UTC).
    - cron: "3 7 * * *"
    # Every December 24th at 7:03 & 7:13 PM EST (converted to UTC).
    - cron: "03 0 24 12 *"
    - cron: "13 0 24 12 *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: data/requirements.txt

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r data/requirements.txt

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: tools-v1
      
      - name: Install tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
      
          # ffmpeg
          sudo apt-get install -y nasm
          git clone --depth=1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --disable-everything --disable-autodetect \
            --disable-doc --disable-network --disable-ffplay \
            --disable-avdevice --disable-postproc \
            --enable-protocol=file,pipe \
            --enable-demuxer=mov,matroska,ogg,mp3,aac,flac,wav,mpegts \
            --enable-muxer=mp4,matroska,wav \
            --enable-decoder=aac,opus,vorbis,mp3,flac,pcm_s16le \
            --enable-encoder=pcm_s16le \
            --enable-parser=aac,opus,vorbis,mpegaudio,flac,h264,hevc,vp9,av1 \
            --enable-bsf=aac_adtstoasc \
            --enable-filter=aresample,aformat,anull,abuffer,abuffersink
          make -j"$(nproc)" ffmpeg ffprobe
          cp ffmpeg ffprobe ~/tools/
          cd ..
      
          # deno
          curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o deno.zip
          unzip -q deno.zip -d ~/tools
      
          # whisper.cpp
          git clone --depth=1 https://github.com/ggerganov/whisper.cpp
          cd whisper.cpp
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build build -j --config Release --target whisper-cli
          cp build/bin/whisper-cli ~/tools/
          ./models/download-ggml-model.sh tiny.en
          cp models/ggml-tiny.en.bin ~/tools/
      
      - name: Add tools to PATH
        run: |
          echo "$HOME/tools" >> "$GITHUB_PATH"
          echo "WHISPER_MODEL=$HOME/tools/ggml-tiny.en.bin" >> "$GITHUB_ENV"

      - name: Save cached cookies to a file
        env:
          COOKIES: ${{ secrets.COOKIES }}
        run: echo "$COOKIES" | base64 -d > cookies.txt

      - name: Run python script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          BACKFILL: ${{ github.event.schedule == '3 7 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python3 ./data/update_data.py

      - name: Push files to GitHub
        if: ${{ success() || failure() || cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "fbcss-deploy[bot]"
          git config --global user.email "fbcss-deploy[bot]@users.noreply.github.com"
          git add data/transcripts.json data/id_map.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated transcription"
            git fetch origin main --depth=1
            git rebase --onto origin/main HEAD~1 HEAD
            git push origin HEAD:main
          fi
